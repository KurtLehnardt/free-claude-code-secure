# Squid egress-filtering proxy for fcc-server.
#
# WHY THIS EXISTS (read this before touching docker-compose.yml):
# Docker Compose / raw Docker networking can isolate containers by NETWORK
# (which we do -- fcc-server sits on an `internal: true` network with no
# route to the internet at all) and can filter by IP/port with iptables,
# but it has NO concept of a hostname. "Only allow traffic to
# api.mistral.ai" is not an ACL Docker (or plain iptables, or an eBPF
# program without a DNS-aware component) can express directly, because at
# the IP/TCP layer a hostname doesn't exist -- and most of these provider
# endpoints sit behind CDNs/load balancers whose IPs are not fixed or
# published, so a static IP allowlist would be both under- and
# over-inclusive and would break silently on provider-side IP rotation.
#
# The fix is to terminate TLS CONNECT requests at an L7-aware proxy that
# DOES understand hostnames -- this Squid instance -- and allowlist by
# `dstdomain` (the SNI/CONNECT target hostname) instead. fcc-server never
# talks to the internet directly; it only ever talks to this proxy over the
# internal network, and this proxy is the only container with a route out
# (see docker-compose.yml networks: internal vs egress-external).
#
# HONEST ALTERNATIVE / COMPLEMENT: for IP-level enforcement (e.g. "this
# proxy itself may only reach 443 on the public internet, never RFC1918
# ranges, to close off SSRF-to-internal-metadata-service style attacks"),
# use iptables/nftables rules on the Docker host, or an eBPF-based policy
# engine (Cilium network policies, etc.) applied to the egress-external
# network's bridge/veth. That is IP/port-level defense-in-depth underneath
# this proxy, not a replacement for it -- it still can't do FQDN matching.

http_port 3128

# ---------------------------------------------------------------------
# Domain allowlist (edit egress/allowed-domains.txt, not this file, to
# add/remove a plain hostname).
# ---------------------------------------------------------------------
acl allowed_domains dstdomain "/etc/squid/allowed-domains.txt"

# AWS Bedrock / GCP Vertex: these two provider hosts have a wildcard
# component (region / GCP project id) that plain `dstdomain` can't express
# without over-granting access to unrelated hosts under the same suffix
# (see the "Intentionally NOT listed" section at the bottom of
# allowed-domains.txt). Handled here with regex ACLs instead, scoped as
# tightly as the wildcard allows.
#
# Bedrock: BEDROCK_DEFAULT_BASE in provider_catalog.py is
# "https://bedrock-mantle.us-east-1.api.aws/v1" -- Bedrock MANTLE (the
# OpenAI-compatible endpoint this codebase actually calls), not the
# native "bedrock-runtime.<region>.amazonaws.com" Bedrock Runtime API.
# bedrock_base_url IS operator-overridable to a different region, so this
# matches any region under api.aws rather than hardcoding us-east-1:
acl allowed_regex dstdom_regex -i ^bedrock-mantle\.[a-z0-9-]+\.api\.aws$

# Vertex: providers/vertex/endpoint.py composes
# "<region>-aiplatform.googleapis.com" for every VERTEX_LOCATION except
# "global" (which uses the bare "aiplatform.googleapis.com" root already
# covered by allowed-domains.txt as a plain entry). Region varies per
# operator, hence regex instead of a fixed hostname:
acl allowed_regex dstdom_regex -i ^[a-z0-9-]+-aiplatform\.googleapis\.com$

# ---------------------------------------------------------------------
# CONNECT (TLS tunneling) is only ever allowed to port 443, and only to
# allowlisted hosts. Every LLM provider endpoint here is HTTPS-only, so
# plain-HTTP allow rules are intentionally not provided.
# ---------------------------------------------------------------------
acl CONNECT method CONNECT
acl SSL_ports port 443

http_access deny CONNECT !SSL_ports
http_access allow CONNECT allowed_domains
http_access allow CONNECT allowed_regex
http_access deny CONNECT all

# No plain-HTTP allow rule, on purpose. Every host in allowed-domains.txt
# (and both regex ACLs above) is HTTPS-only per its default_base_url in
# provider_catalog.py -- there is no LLM provider in this catalog that
# fcc-server would legitimately reach over plain HTTP. An earlier draft of
# this file allowed non-CONNECT requests to allowlisted hosts "in case a
# provider exposes a plain-HTTP endpoint"; that was inconsistent with the
# HTTPS-only reasoning used everywhere else in this file, so it's been
# dropped rather than half-fixed with a Safe_ports carve-out nothing here
# actually needs. If a provider is ever added that genuinely requires
# plain HTTP, add a scoped `http_access allow <method> <acl> port 80` rule
# then, rather than reopening this for everything.

# Default deny: anything not explicitly allowed above is refused
# (including all non-CONNECT/plain-HTTP traffic). This line must stay
# LAST.
http_access deny all

# ---------------------------------------------------------------------
# Hygiene / privacy: this proxy tunnels TLS (CONNECT), it does NOT
# terminate/inspect it (no `ssl_bump`, no injected CA) -- provider request
# and response bodies, including auth headers, stay end-to-end encrypted
# between fcc-server and the provider. Squid only ever sees the CONNECT
# target hostname and port, never the traffic inside the tunnel.
# ---------------------------------------------------------------------
via off
forwarded_for delete
cache deny all

# Access log goes to stdout, not a file under /var/log/squid, so it's
# captured by `docker compose logs`/whatever log driver the host uses
# instead of accumulating unbounded on the /var/log/squid tmpfs (that
# tmpfs, sized in docker-compose.yml, only needs to hold cache.log + the
# pid file now -- there is no squid-side log rotation configured, and
# none is needed since nothing squid itself writes grows without bound
# once access_log is off the tmpfs).
access_log stdio:/dev/stdout combined
